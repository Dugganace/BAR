const container = document.getElementById('rows');
commands.forEach(cmd => {
	const row = document.createElement('div');
	row.className = 'row';
	const label = document.createElement('div');
	label.className = 'label';
	label.textContent = cmd.slot;
	const size = document.createElement('div');
	size.className = 'size';
	size.textContent = cmd.text.length + ' chars';
	const btn = document.createElement('button');
	btn.textContent = 'Copy';
	function showCopied() {
		btn.textContent = 'Copied!';
		btn.classList.add('copied');
		setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
	}
	function fallbackCopy() {
		const ta = document.createElement('textarea');
		ta.value = cmd.text;
		ta.style.position = 'fixed';
		ta.style.opacity = '0';
		document.body.appendChild(ta);
		ta.focus();
		ta.select();
		try {
			document.execCommand('copy');
			showCopied();
		} catch (e) {
			btn.textContent = 'Copy failed - select text below';
			const pre = document.createElement('pre');
			pre.textContent = cmd.text;
			pre.style.whiteSpace = 'pre-wrap';
			pre.style.wordBreak = 'break-all';
			pre.style.fontSize = '10px';
			pre.style.userSelect = 'all';
			btn.parentElement.appendChild(pre);
		}
		document.body.removeChild(ta);
	}
	btn.onclick = () => {
		try {
			if (navigator.clipboard && navigator.clipboard.writeText) {
				navigator.clipboard.writeText(cmd.text).then(showCopied).catch(fallbackCopy);
			} else {
				fallbackCopy();
			}
		} catch (e) {
			fallbackCopy();
		}
	};
	row.appendChild(label);
	row.appendChild(size);
	row.appendChild(btn);
	container.appendChild(row);
});
</script>
