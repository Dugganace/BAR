<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BAR Preset Catalog Browser</title>
<style>
	:root {
		--bg: #1a1c20; --panel: #24272d; --border: #3a3e46;
		--text: #e6e8eb; --text-dim: #9aa0aa; --accent: #5fb3ff; --highlight: #6bd48a44;
	}
	* { box-sizing: border-box; }
	body { margin: 0; font-family: -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; }
	header { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
	header h1 { font-size: 15px; margin: 0; font-weight: 600; }
	#search { flex: 1; max-width: 420px; background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 10px; font-size: 13px; }
	#stats { color: var(--text-dim); font-size: 12px; }
	main { flex: 1; display: flex; overflow: hidden; }
	#sidebar { width: 340px; overflow-y: auto; border-right: 1px solid var(--border); padding: 8px; }
	.preset-group { margin-bottom: 6px; }
	.preset-name { font-weight: 600; font-size: 13px; padding: 6px 8px; cursor: pointer; border-radius: 4px; }
	.preset-name:hover { background: var(--panel); }
	.preset-map { color: var(--text-dim); font-size: 11px; margin-left: 8px; }
	.slot-list { padding-left: 18px; display: none; }
	.slot-list.open { display: block; }
	.slot-item { padding: 4px 8px; font-size: 12px; cursor: pointer; border-radius: 4px; color: var(--text-dim); }
	.slot-item:hover { background: var(--panel); color: var(--text); }
	.slot-item.active { background: var(--accent); color: #0b1a24; font-weight: 600; }
	#content { flex: 1; overflow-y: auto; padding: 20px; }
	#content h2 { margin-top: 0; font-size: 15px; }
	.meta-row { color: var(--text-dim); font-size: 12px; margin-bottom: 4px; }
	.unit-tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 10px 0; }
	.unit-tag { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 2px 8px; font-size: 11px; font-family: Consolas, monospace; cursor: pointer; }
	.unit-tag:hover { border-color: var(--accent); }
	pre { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; font-size: 12px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
	mark { background: var(--highlight); color: inherit; }
	.hint { color: var(--text-dim); font-size: 13px; }
	button { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
	button:hover { border-color: var(--accent); }
	.summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin: 14px 0; }
	.summary-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 3px; }
	.summary-card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 5px; background: #111; }
	.summary-card .icon-placeholder { width: 100%; aspect-ratio: 1; border-radius: 5px; background: #111; }
	.summary-card .sc-name { font-weight: 600; font-size: 11.5px; }
	.summary-card .sc-id { color: var(--text-dim); font-size: 9.5px; font-family: Consolas, monospace; }
</style>
</head>
<body>

<header>
	<a href="../../bar-toolkit-hub/index.html" style="color:var(--accent);text-decoration:none;font-size:12px;">&larr; Hub</a>
	<h1>BAR Preset Catalog</h1>
	<input id="search" type="text" placeholder="Search presets, unit ids, header text, or raw code...">
	<span id="stats"></span>
</header>

<main>
	<nav id="sidebar"></nav>
	<section id="content"><p class="hint">Pick a preset on the left, or search above.</p></section>
</main>

<script src="../../bar-unit-database/viewer/data.js"></script>
<script src="../../bar-preset-builder/custom-content.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
