<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BAR Unit Database</title>
<style>
	:root { --bg: #1a1c20; --panel: #24272d; --border: #3a3e46; --text: #e6e8eb; --text-dim: #9aa0aa; --accent: #5fb3ff; }
	* { box-sizing: border-box; }
	body { margin: 0; font-family: -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; }
	header { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
	header h1 { font-size: 15px; margin: 0; }
	#search { flex: 1; min-width: 200px; max-width: 420px; background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 10px; font-size: 13px; }
	#stats { color: var(--text-dim); font-size: 12px; margin-left: auto; }
	#tabs { display: flex; gap: 4px; padding: 8px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
	.tab { padding: 6px 14px; border-radius: 6px; background: var(--panel); border: 1px solid var(--border); cursor: pointer; font-size: 13px; }
	.tab.active { background: var(--accent); color: #0b1a24; font-weight: 600; border-color: var(--accent); }
	#kindTabs { display: flex; gap: 4px; padding: 8px 16px 0; }
	#kindTabs .tab { font-size: 12px; padding: 5px 12px; }
	#modalBg { display: none; position: fixed; inset: 0; background: #000a; z-index: 10; align-items: center; justify-content: center; }
	#modalBg.open { display: flex; }
	#modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; width: 420px; max-height: 80vh; overflow-y: auto; }
	#modal h2 { margin: 0 0 4px; font-size: 16px; }
	#modal .mid { color: var(--text-dim); font-size: 11px; font-family: Consolas, monospace; margin-bottom: 12px; }
	#modal .stat-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
	#modal .stat-row span:first-child { color: var(--text-dim); }
	#modal img { width: 96px; height: 96px; border-radius: 8px; background: #111; float: right; margin-left: 12px; }
	#modal .close { margin-top: 14px; cursor: pointer; color: var(--accent); font-size: 12px; }
	#modal .customize-link { display: inline-block; margin-top: 10px; color: var(--accent); font-size: 12px; text-decoration: none; }
	#grid { flex: 1; overflow-y: auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; align-content: start; }
	.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 4px; }
	.card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; background: #111; }
	.card .icon-placeholder { width: 100%; aspect-ratio: 1; border-radius: 6px; background: #111; display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 10px; }
	.card-name { font-weight: 600; font-size: 12.5px; }
	.card-desc { color: var(--text-dim); font-size: 11px; }
	.card-id { color: var(--text-dim); font-size: 10px; font-family: Consolas, monospace; }
</style>
</head>
<body>
<header>
	<a href="../../bar-toolkit-hub/index.html" style="color:var(--accent);text-decoration:none;font-size:12px;">&larr; Hub</a>
	<h1>BAR Unit Database</h1>
	<input id="search" type="text" placeholder="Search name, id, description...">
	<span id="stats"></span>
</header>
<div id="kindTabs"></div>
<div id="tabs"></div>
<div id="grid"></div>
<div id="modalBg"><div id="modal"></div></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
