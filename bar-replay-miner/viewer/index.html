<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BAR Replay Miner</title>
<style>
	:root { --bg: #1a1c20; --panel: #24272d; --border: #3a3e46; --text: #e6e8eb; --text-dim: #9aa0aa; --accent: #5fb3ff; --good: #6bd48a; }
	* { box-sizing: border-box; }
	body { margin: 0; font-family: -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; }
	header { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
	header h1 { font-size: 15px; margin: 0; }
	header p { color: var(--text-dim); font-size: 11.5px; margin: 0; }
	#stats { color: var(--text-dim); font-size: 12px; margin-left: auto; }
	main { flex: 1; display: flex; overflow: hidden; }
	#presetList { width: 320px; overflow-y: auto; border-right: 1px solid var(--border); padding: 8px; }
	.preset-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-bottom: 3px; }
	.preset-item:hover { background: var(--panel); }
	.preset-item.active { background: var(--accent); color: #0b1a24; font-weight: 600; }
	.preset-item .meta { color: var(--text-dim); font-size: 10px; display: block; }
	.preset-item.active .meta { color: #0b1a2499; }
	#content { flex: 2; overflow-y: auto; padding: 16px; }
	#content h2 { margin-top: 0; font-size: 15px; }
	#content .presetMeta { color: var(--text-dim); font-size: 11.5px; margin-bottom: 14px; }
	.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
	.card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
	.card:hover { border-color: var(--accent); }
	.card.picked { border-color: var(--good); background: #6bd48a1a; }
	.card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 5px; background: #111; }
	.card .icon-placeholder { width: 100%; aspect-ratio: 1; border-radius: 5px; background: #111; }
	.card-name { font-weight: 600; font-size: 11.5px; }
	.card-desc { color: var(--text-dim); font-size: 10px; }
	.card-base { color: var(--text-dim); font-size: 9.5px; font-family: Consolas, monospace; }
	#cart { flex: 1; max-width: 320px; border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
	#cart h3 { padding: 12px 12px 0; font-size: 12px; color: var(--text-dim); text-transform: uppercase; margin: 0; }
	#cartItems { flex: 1; overflow-y: auto; padding: 10px 12px; }
	.cart-item { display: flex; justify-content: space-between; align-items: center; padding: 5px 8px; background: var(--panel); border-radius: 6px; margin-bottom: 5px; font-size: 11.5px; }
	.cart-item .src { color: var(--text-dim); font-size: 9.5px; display: block; }
	.cart-item button { background: none; border: none; color: #ff6b6b; cursor: pointer; font-size: 13px; }
	#exportBtn { margin: 12px; padding: 9px; background: var(--accent); color: #0b1a24; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 12.5px; }
	.hint { color: var(--text-dim); font-size: 11px; padding: 0 12px 10px; }
	.players { color: var(--text-dim); font-size: 10px; margin-top: 2px; }
</style>
</head>
<body>
<header>
	<a href="../../bar-toolkit-hub/index.html" style="color:var(--accent);text-decoration:none;font-size:12px;">&larr; Hub</a>
	<h1>Replay Miner</h1>
	<p>Custom content pulled straight out of your own 710 local game replays.</p>
	<span id="stats"></span>
</header>
<main>
	<nav id="presetList"></nav>
	<section id="content"><p class="hint">Pick a preset variant on the left to see the custom units/buildings that game actually used.</p></section>
	<aside id="cart">
		<h3>Picked</h3>
		<p class="hint">Click any card to add/remove it here. Picks persist as you browse.</p>
		<div id="cartItems"></div>
		<button id="exportBtn">Export picks as JSON</button>
	</aside>
</main>
<script src="replay-content.js"></script>
<script src="app.js"></script>
</body>
</html>
