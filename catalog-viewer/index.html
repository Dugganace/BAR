<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BAR Custom Content Catalog</title>
<style>
	:root { --bg: #1a1c20; --panel: #24272d; --border: #3a3e46; --text: #e6e8eb; --text-dim: #9aa0aa; --accent: #5fb3ff; --good: #6bd48a; --bad: #ff8a8a; }
	* { box-sizing: border-box; }
	body { margin: 0; font-family: -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text); }
	header { padding: 14px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 5; }
	header h1 { font-size: 17px; margin: 0 0 8px; }
	header p { color: var(--text-dim); font-size: 12px; margin: 0 0 10px; }
	#controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
	#search { flex: 1; min-width: 200px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; }
	.faction-btn { padding: 7px 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; color: var(--text-dim); font-size: 12px; cursor: pointer; }
	.faction-btn.active { background: var(--accent); color: #0b1a24; border-color: var(--accent); font-weight: 600; }
	#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; padding: 16px 20px; }
	.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; gap: 12px; }
	.card img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; background: #111; flex-shrink: 0; }
	.card-body { flex: 1; min-width: 0; }
	.card-name { font-weight: 700; font-size: 13.5px; margin-bottom: 2px; }
	.card-base { color: var(--text-dim); font-size: 10.5px; font-family: Consolas, monospace; margin-bottom: 8px; }
	.changes { list-style: none; margin: 0; padding: 0; font-size: 11px; }
	.changes li { padding: 2px 0; color: var(--text-dim); }
	.changes li.tooltip { font-style: italic; color: var(--text); margin-top: 4px; }
	.pct-up { color: var(--good); }
	.pct-down { color: var(--bad); }
	#stats { color: var(--text-dim); font-size: 11.5px; }
</style>
</head>
<body>
<header>
	<a href="../../bar-toolkit-hub/index.html" style="color:var(--accent);text-decoration:none;font-size:12px;">&larr; Hub</a>
	<h1>Custom Content Catalog</h1>
	<p>Every custom unit/building found across your own replay history, with real stat changes vs. the vanilla base unit. Click a faction to filter, or search by name.</p>
	<div id="controls">
		<input id="search" type="text" placeholder="Search by name or id...">
		<button class="faction-btn active" data-faction="all">All</button>
		<button class="faction-btn" data-faction="Armada">Armada</button>
		<button class="faction-btn" data-faction="Cortex">Cortex</button>
		<button class="faction-btn" data-faction="Legion">Legion</button>
		<button class="faction-btn" data-faction="Scavengers">Scavengers</button>
		<button class="faction-btn" data-faction="Raptors">Raptors</button>
	</div>
	<p id="stats" style="margin-top:8px"></p>
</header>
<div id="grid"></div>
<script src="catalog-data.js"></script>
<script src="app.js"></script>
</body>
</html>
